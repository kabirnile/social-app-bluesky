name: Build and Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate || npm install -g pnpm@latest --force

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Workspace Integrity
        run: |
          if [ -f "pnpm-workspace.yaml" ]; then
            grep -q "packages:" pnpm-workspace.yaml || echo -e "packages:\n  - '.'" >> pnpm-workspace.yaml
          fi

      - name: Remove Dev Client Dependency (Forces Pure Standalone App)
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.dependencies && pkg.dependencies["expo-dev-client"]) {
              delete pkg.dependencies["expo-dev-client"];
            }
            if (pkg.devDependencies && pkg.devDependencies["expo-dev-client"]) {
              delete pkg.devDependencies["expo-dev-client"];
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("Purged expo-dev-client from package.json");
          '

      - name: Replace Bluesky Blue Colors with Solid Black
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function replaceInDir(dir) {
              if (!fs.existsSync(dir)) return;
              fs.readdirSync(dir).forEach(file => {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  if (file !== "node_modules" && file !== ".git") replaceInDir(fullPath);
                } else if (/\.(ts|tsx|js|json)$/.test(file)) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  const blueRegex = /#(006AFF|0085ff|1185fe|208bfe|002861|005ad4)/gi;
                  if (blueRegex.test(content)) {
                    content = content.replace(blueRegex, "#000000");
                    fs.writeFileSync(fullPath, content);
                  }
                }
              });
            }
            replaceInDir("src");
            console.log("All primary blue colors replaced with solid black (#000000).");
          '

      - name: Update Visual Text to Deducia
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "src/locale/locales/en/messages.json",
              "src/locale/locales/en/messages.po"
            ];
            files.forEach(f => {
              if (fs.existsSync(f)) {
                let content = fs.readFileSync(f, "utf8");
                content = content.replace(/Bluesky/g, "Deducia");
                fs.writeFileSync(f, content);
              }
            });
            console.log("English UI strings updated to Deducia.");
          '

      - name: Overwrite Icons and Logos with Deducia Logo
        run: |
          if [ -f "deducia-logo.png" ]; then
            echo "Replacing icons and splash images with deducia-logo.png..."
            find assets -type f \( -name "*icon*.png" -o -name "*splash*.png" \) -exec cp -f deducia-logo.png "{}" \;
          fi

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Offline APK (Release Mode)
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx4096m -Dfile.encoding=UTF-8"
          # Assemble release bundles JS offline into the APK and signs with standard debug keystore
          ./gradlew assembleRelease -x lint -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Locate Generated APK
        id: find-apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deducia-app-standalone
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Deducia Social v1.0.0 (Build ${{ github.run_number }})"
          body: "Standalone Deducia APK. Opens directly to Login and Sign-up without development server prompts."
          files: ${{ steps.find-apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
