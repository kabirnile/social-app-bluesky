name: Build and Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate || npm install -g pnpm@latest --force

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Workspace Integrity
        run: |
          if [ -f "pnpm-workspace.yaml" ]; then
            grep -q "packages:" pnpm-workspace.yaml || echo -e "packages:\n  - '.'" >> pnpm-workspace.yaml
          fi

      - name: Purge Dev Client Package
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("package.json")) {
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              if (pkg.dependencies && pkg.dependencies["expo-dev-client"]) delete pkg.dependencies["expo-dev-client"];
              if (pkg.devDependencies && pkg.devDependencies["expo-dev-client"]) delete pkg.devDependencies["expo-dev-client"];
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            }
          '

      - name: Apply Deducia Visual, Color & Link Branding
        run: |
          cat << 'EOF' > patch_branding.js
          const fs = require('fs');
          const path = require('path');

          function walkDir(dir, callback) {
            if (!fs.existsSync(dir)) return;
            fs.readdirSync(dir).forEach(file => {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                if (file !== 'node_modules' && file !== '.git' && file !== 'android' && file !== 'ios') {
                  walkDir(fullPath, callback);
                }
              } else {
                callback(fullPath);
              }
            });
          }

          walkDir('src', filePath => {
            if (!/\.(ts|tsx|js|jsx|json|po)$/.test(filePath)) return;
            let content = fs.readFileSync(filePath, 'utf8');
            let changed = false;

            // 1. Reroute Terms of Service, Privacy Policy, Help, and Feedback links
            const bskyLinks = [
              /https:\/\/(?:bsky\.app|bsky\.social)\/about\/(?:support\/)?(?:tos|privacy-policy)[^\s"'`)]*/gi,
              /https:\/\/blueskyweb\.zendesk\.com[^\s"'`)]*/gi,
              /https:\/\/blueskyweb\.xyz[^\s"'`)]*/gi
            ];
            bskyLinks.forEach(regex => {
              if (regex.test(content)) {
                content = content.replace(regex, 'https://deducia.com/social/links');
                changed = true;
              }
            });

            if (content.includes('HELP_DESK_URL')) {
              content = content.replace(/HELP_DESK_URL\s*=\s*['"][^'"]+['"]/g, 'HELP_DESK_URL = "https://deducia.com/social/links"');
              changed = true;
            }
            if (content.includes('FEEDBACK_URL')) {
              content = content.replace(/FEEDBACK_URL\s*=\s*['"][^'"]+['"]/g, 'FEEDBACK_URL = "https://deducia.com/social/links"');
              changed = true;
            }

            // 2. Convert all blue shades to solid black (#000000)
            const blueRegex = /#(006AFF|0085FF|1185FE|208BFE|002861|005AD4|1083FE|0070FF|0066FF|0A7AFF|1D9BF0|0057CC|2B82EC|1D7BE8|1B85F3)/gi;
            if (blueRegex.test(content)) {
              content = content.replace(blueRegex, '#000000');
              changed = true;
            }

            // 3. Update visible names while preserving underlying packages
            if (!filePath.endsWith('package.json')) {
              if (content.includes('Bluesky Social')) {
                content = content.replace(/Bluesky Social/g, 'Deducia Social');
                changed = true;
              }
              if (content.includes('>Bluesky<')) {
                content = content.replace(/>Bluesky</g, '>Deducia<');
                changed = true;
              }
            }

            // 4. Replace butterfly logo components with Fox icon
            if (/Logo(type)?\.(tsx|ts|jsx|js)$/.test(filePath)) {
              if (content.includes('<Svg') || content.includes('Butterfly') || content.includes('path')) {
                content = `
          import React from "react";
          import { Image } from "react-native";
          export function Logo({ width = 28, fill, style }: any) {
            return (
              <Image
                source={require("../../assets/app-icons/android_icon_default_next.png")}
                style={[{ width: width, height: width, resizeMode: "contain" }, style]}
              />
            );
          }
          export const Logotype = Logo;
          export default Logo;
          `;
                changed = true;
              }
            }

            if (changed) {
              fs.writeFileSync(filePath, content);
            }
          });

          // 5. Update localization catalogs
          const localeFiles = [
            'src/locale/locales/en/messages.json',
            'src/locale/locales/en/messages.po'
          ];
          localeFiles.forEach(f => {
            if (fs.existsSync(f)) {
              let text = fs.readFileSync(f, 'utf8');
              text = text.replace(/Bluesky/g, 'Deducia');
              fs.writeFileSync(f, text);
            }
          });

          console.log('Branding, links, and black color scheme successfully injected.');
          EOF
          node patch_branding.js
          rm patch_branding.js

      - name: Replace Welcome Screen Background
        run: |
          if [ -f "deducia-welcome.png" ]; then
            echo "Applying deducia-welcome.png to welcome and auth screens..."
            find assets -type f \( -iname "*signin*" -o -iname "*signup*" -o -iname "*wallpaper*" -o -iname "*welcome*" -o -iname "*illustration*" -o -iname "*cover*" \) -exec cp -f deducia-welcome.png "{}" \;
            find assets -type f -name "*.png" ! -name "*icon*" ! -name "*splash*" -size +40k -exec cp -f deducia-welcome.png "{}" \;
          else
            echo "deducia-welcome.png not found. Skipping."
          fi

      - name: Replace App Icons and Logos
        run: |
          LOGO_SOURCE=""
          if [ -f "ic_launcher.png" ]; then
            LOGO_SOURCE="ic_launcher.png"
          elif [ -f "deducia-logo.png" ]; then
            LOGO_SOURCE="deducia-logo.png"
          fi

          if [ -n "$LOGO_SOURCE" ]; then
            echo "Replacing icons and splash screens using $LOGO_SOURCE..."
            find assets -type f \( -name "*icon*.png" -o -name "*splash*.png" \) -exec cp -f "$LOGO_SOURCE" "{}" \;
          else
            echo "No logo file found in root. Keeping default assets."
          fi

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Compile Lingui Localization Files
        run: |
          pnpm run intl:build || pnpm run intl:compile || pnpm exec lingui compile || npx @lingui/cli compile || true

          node -e '
            const fs = require("fs");
            const path = require("path");
            const localesDir = path.join("src", "locale", "locales");
            if (fs.existsSync(localesDir)) {
              fs.readdirSync(localesDir).forEach(dir => {
                const sub = path.join(localesDir, dir);
                if (fs.statSync(sub).isDirectory()) {
                  const targetJs = path.join(sub, "messages.js");
                  const targetTs = path.join(sub, "messages.ts");
                  if (!fs.existsSync(targetJs) && !fs.existsSync(targetTs)) {
                    fs.writeFileSync(targetJs, "export const messages = {};\n");
                  }
                }
              });
            }
          '

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Offline APK (Release Mode)
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx4096m -Dfile.encoding=UTF-8"
          ./gradlew assembleRelease -x lint -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Locate Generated APK
        id: find-apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deducia-app-standalone
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Deducia Social v1.0.0 (Build ${{ github.run_number }})"
          body: "Standalone Deducia APK with custom welcome background, Fox icon, solid black accents, and deducia.com links."
          files: ${{ steps.find-apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
