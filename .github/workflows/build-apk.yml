name: Build and Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Detect Package Manager and Install Dependencies
        run: |
          if [ -f "yarn.lock" ]; then
            echo "Detected yarn.lock — installing with Yarn"
            yarn install --network-timeout 100000
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "Detected pnpm-lock.yaml — installing with pnpm"
            npx pnpm install --no-frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            echo "Detected package-lock.json — installing with npm"
            npm install --legacy-peer-deps
          else
            echo "No lockfile detected — installing with npm default"
            npm install --legacy-peer-deps
          fi

      - name: Generate Android Native Project
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --clean
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx4096m -Dfile.encoding=UTF-8"
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deducia-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Deducia Social v1.0.0 (Build ${{ github.run_number }})"
          body: "Direct APK download for Android. Built with native package identifier `com.deducia.social`."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
