name: Build and Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate || npm install -g pnpm@latest --force

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Workspace Integrity
        run: |
          if [ -f "pnpm-workspace.yaml" ]; then
            grep -q "packages:" pnpm-workspace.yaml || echo -e "packages:\n  - '.'" >> pnpm-workspace.yaml
          fi

      - name: Purge Dev Client Package
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.dependencies && pkg.dependencies["expo-dev-client"]) delete pkg.dependencies["expo-dev-client"];
            if (pkg.devDependencies && pkg.devDependencies["expo-dev-client"]) delete pkg.devDependencies["expo-dev-client"];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Replace Bluesky Blue Colors with Solid Black
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function replaceBlues(targetDir) {
              if (!fs.existsSync(targetDir)) return;
              fs.readdirSync(targetDir).forEach(item => {
                const itemPath = path.join(targetDir, item);
                if (fs.statSync(itemPath).isDirectory()) {
                  if (item !== "node_modules" && item !== ".git") replaceBlues(itemPath);
                } else if (/\.(ts|tsx|js|json|xml)$/.test(item)) {
                  let str = fs.readFileSync(itemPath, "utf8");
                  const blueRegex = /#(006AFF|0085FF|1185FE|208BFE|002861|005AD4|1083FE|0070FF)/gi;
                  if (blueRegex.test(str)) {
                    str = str.replace(blueRegex, "#000000");
                    fs.writeFileSync(itemPath, str);
                  }
                }
              });
            }

            replaceBlues("src");
            replaceBlues("plugins");
            console.log("All UI and plugin blue colors converted to #000000.");
          '

      - name: Update Visual Strings to Deducia
        run: |
          node -e '
            const fs = require("fs");
            const targets = [
              "src/locale/locales/en/messages.json",
              "src/locale/locales/en/messages.po"
            ];
            targets.forEach(filePath => {
              if (fs.existsSync(filePath)) {
                let content = fs.readFileSync(filePath, "utf8");
                content = content.replace(/Bluesky/g, "Deducia");
                fs.writeFileSync(filePath, content);
              }
            });
          '

      - name: Overwrite Icons and Logos with Deducia Logo
        run: |
          if [ -f "deducia-logo.png" ]; then
            echo "Replacing icons and splash images with deducia-logo.png..."
            find assets -type f \( -name "*icon*.png" -o -name "*splash*.png" \) -exec cp -f deducia-logo.png "{}" \;
          fi

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Compile Lingui Localization Files
        run: |
          echo "Compiling Lingui catalogs..."
          pnpm run intl:build || pnpm run intl:compile || pnpm exec lingui compile || npx @lingui/cli compile || true

          # Guarantee every locale has a valid messages file so Metro bundler never fails
          node -e '
            const fs = require("fs");
            const path = require("path");
            const localesDir = path.join("src", "locale", "locales");
            if (fs.existsSync(localesDir)) {
              fs.readdirSync(localesDir).forEach(dir => {
                const subPath = path.join(localesDir, dir);
                if (fs.statSync(subPath).isDirectory()) {
                  const targetJs = path.join(subPath, "messages.js");
                  const targetTs = path.join(subPath, "messages.ts");
                  if (!fs.existsSync(targetJs) && !fs.existsSync(targetTs)) {
                    fs.writeFileSync(targetJs, "export const messages = {};\n");
                    console.log("Created fallback for:", targetJs);
                  }
                }
              });
            }
          '

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Offline APK (Release Mode)
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx4096m -Dfile.encoding=UTF-8"
          ./gradlew assembleRelease -x lint -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Locate Generated APK
        id: find-apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deducia-app-standalone
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Deducia Social v1.0.0 (Build ${{ github.run_number }})"
          body: "Standalone release APK with solid black branding and offline bundled assets."
          files: ${{ steps.find-apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
