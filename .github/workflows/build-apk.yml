name: Build and Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate || npm install -g pnpm@latest --force

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Workspace Integrity
        run: |
          if [ -f "pnpm-workspace.yaml" ]; then
            grep -q "packages:" pnpm-workspace.yaml || echo -e "packages:\n  - '.'" >> pnpm-workspace.yaml
          fi

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --clean

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx4096m -Dfile.encoding=UTF-8"
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deducia-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Deducia Social v1.0.0 (Build ${{ github.run_number }})"
          body: "Direct APK download for Android. Built with native package identifier `com.deducia.social`."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
