name: Build and Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Remove any invalid workspace files
        run: rm -f pnpm-workspace.yaml

      - name: Install Dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx4096m -Dfile.encoding=UTF-8"
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deducia-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Deducia Social v1.0.0 (Build ${{ github.run_number }})"
          body: "Direct APK download for Android. Built with native package identifier `com.deducia.social`."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
